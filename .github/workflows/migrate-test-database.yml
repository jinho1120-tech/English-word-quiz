name: Repair and apply test database migrations

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-test-db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate database secret
        env:
          DATABASE_URL: ${{ secrets.ENGLISH_WORD_QUIZ_DATABASE_URL || secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || secrets.POSTGRES_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Database secret is missing."
            exit 1
          fi
      - name: Validate test database and migration history
        env:
          DATABASE_URL: ${{ secrets.ENGLISH_WORD_QUIZ_DATABASE_URL || secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || secrets.POSTGRES_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const identity = await client.query("select current_database() as db, current_user as role");
            const dbName = identity.rows[0].db;
            console.log("Connected database:", dbName, "role:", identity.rows[0].role);
            if (dbName !== "neondb") {
              throw new Error(`Safety stop: expected test database neondb, got ${dbName}`);
            }
            const tables = await client.query(`
              select count(*)::int as count
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relkind in ('r', 'p')
            `);
            const tableCount = tables.rows[0].count;
            console.log("Existing public tables:", tableCount);
            if (tableCount === 0) {
              await client.query('DROP SCHEMA IF EXISTS "drizzle" CASCADE');
              console.log("Empty public schema: removed stale Drizzle history so all migrations can run from the beginning.");
            } else {
              const historyTable = await client.query("select to_regclass('drizzle.__drizzle_migrations') as name");
              if (!historyTable.rows[0].name) {
                throw new Error("Safety stop: existing public tables have no Drizzle migration history.");
              }
              const history = await client.query('select count(*)::int as count from "drizzle"."__drizzle_migrations"');
              const appliedCount = history.rows[0].count;
              console.log("Existing applied migration count:", appliedCount);
              if (![12, 13].includes(appliedCount)) {
                throw new Error("Safety stop: expected 12 pending or 13 already-applied migrations.");
              }
              console.log("Existing public schema and migration history preserved; only pending migrations will be applied.");
            }
          } finally {
            await client.end();
          }
          NODE
      - name: Apply all migrations
        env:
          DATABASE_URL: ${{ secrets.ENGLISH_WORD_QUIZ_DATABASE_URL || secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || secrets.POSTGRES_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          import { drizzle } from "drizzle-orm/node-postgres";
          import { migrate } from "drizzle-orm/node-postgres/migrator";
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            await migrate(drizzle(pool), { migrationsFolder: "./drizzle" });
            console.log("All migration files applied.");
          } catch (error) {
            console.error("Migration failed:", error?.message);
            console.error("PostgreSQL cause:", error?.cause?.message);
            console.error("PostgreSQL code:", error?.cause?.code);
            console.error(error?.stack);
            process.exitCode = 1;
          } finally {
            await pool.end();
          }
          NODE
      - name: Verify all migrations and core tables
        if: success()
        env:
          DATABASE_URL: ${{ secrets.ENGLISH_WORD_QUIZ_DATABASE_URL || secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || secrets.POSTGRES_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const history = await client.query('select count(*)::int as count from "drizzle"."__drizzle_migrations"');
            const tables = await client.query(`
              select count(*)::int as count
              from pg_class c join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relkind in ('r', 'p')
            `);
            const required = await client.query(`
              select table_name from information_schema.tables
              where table_schema = 'public'
                and table_name in ('families', 'child_profiles', 'family_arcade_settings', 'child_pacman_daily_plays', 'child_coupon_settings')
              order by table_name
            `);
            console.log("Applied migration count:", history.rows[0].count);
            console.log("Public table count:", tables.rows[0].count);
            const capacityColumn = await client.query(`
              select column_name from information_schema.columns
              where table_schema = 'public' and table_name = 'child_coupon_settings'
                and column_name = 'max_stored_coupons'
            `);
            console.log("Required feature tables:", required.rows.map(row => row.table_name));
            console.log("Coupon wallet capacity column:", capacityColumn.rowCount === 1 ? "present" : "missing");
            if (history.rows[0].count !== 13) throw new Error("Expected exactly 13 applied migrations.");
            if (tables.rows[0].count < 1) throw new Error("No public tables were created.");
            if (required.rowCount !== 5) throw new Error("One or more required feature tables are missing.");
            if (capacityColumn.rowCount !== 1) throw new Error("Coupon wallet capacity column is missing.");
          } finally {
            await client.end();
          }
          NODE
