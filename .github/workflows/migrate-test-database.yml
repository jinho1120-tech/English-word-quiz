name: Repair and migrate test database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-test-db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/parent-manager-ui-cleanup
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Validate and inspect test database
        env:
          DATABASE_URL: ${{ secrets.ENGLISH_WORD_QUIZ_DATABASE_URL || secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || secrets.POSTGRES_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Database secret is missing."
            exit 1
          fi
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const identity = await client.query("select current_database() as db, current_user as role");
            console.log("Connected database:", identity.rows[0].db, "role:", identity.rows[0].role);
            const tables = await client.query("select count(*)::int as count from information_schema.tables where table_schema='public' and table_type='BASE TABLE'");
            console.log("Existing public tables:", tables.rows[0].count);
            if (tables.rows[0].count !== 0) {
              throw new Error("Safety stop: public schema is not empty. No migration history was changed.");
            }
          } finally {
            await client.end();
          }
          NODE
      - name: Reset stale migration history only
        env:
          DATABASE_URL: ${{ secrets.ENGLISH_WORD_QUIZ_DATABASE_URL || secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || secrets.POSTGRES_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const identity = await client.query("select current_database() as db");
            if (identity.rows[0].db !== "neondb") {
              throw new Error("Safety stop: unexpected database; expected neondb.");
            }
            await client.query('DROP SCHEMA IF EXISTS "drizzle" CASCADE');
            console.log("Removed stale Drizzle migration history. Public schema was not touched.");
          } finally {
            await client.end();
          }
          NODE
      - name: Apply all migrations from current feature branch
        env:
          DATABASE_URL: ${{ secrets.ENGLISH_WORD_QUIZ_DATABASE_URL || secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || secrets.POSTGRES_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          import { drizzle } from "drizzle-orm/node-postgres";
          import { migrate } from "drizzle-orm/node-postgres/migrator";
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            await migrate(drizzle(pool), { migrationsFolder: "./drizzle" });
            console.log("All feature-branch migrations applied.");
          } finally {
            await pool.end();
          }
          NODE
      - name: Verify migration history and created tables
        env:
          DATABASE_URL: ${{ secrets.ENGLISH_WORD_QUIZ_DATABASE_URL || secrets.DATABASE_URL || secrets.NEON_DATABASE_URL || secrets.POSTGRES_URL }}
        run: |
          node --input-type=module <<'NODE'
          import pg from "pg";
          const client = new pg.Client({ connectionString: process.env.DATABASE_URL });
          await client.connect();
          try {
            const history = await client.query('select count(*)::int as count from "drizzle"."__drizzle_migrations"');
            const tables = await client.query("select count(*)::int as count from information_schema.tables where table_schema='public' and table_type='BASE TABLE'");
            console.log("Recorded migrations:", history.rows[0].count);
            console.log("Public tables created:", tables.rows[0].count);
            if (history.rows[0].count !== 12) throw new Error("Expected 12 recorded migrations.");
            if (tables.rows[0].count < 1) throw new Error("No public tables were created.");
          } finally {
            await client.end();
          }
          NODE
