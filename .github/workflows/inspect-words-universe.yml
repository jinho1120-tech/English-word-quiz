name: Inspect WortUniversum vocabulary database (read-only audit)

on:
  push:
    branches:
      - analysis/grundwortschatz-db-inspection

permissions:
  contents: write

concurrency:
  group: grundwortschatz-db-inspection-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: record WortUniversum inspection run metadata')
    name: Download and inspect SQLite source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v4

      - name: Record run ID for artifact retrieval
        run: |
          mkdir -p analysis-output
          cat > analysis-output/last-run.json <<EOF
          {
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "commit": "${GITHUB_SHA}",
            "workflow": "Inspect WortUniversum vocabulary database"
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis-output/last-run.json
          git commit -m "chore: record WortUniversum inspection run metadata"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download, verify and inspect source database
        run: python scripts/inspect_grundwortschatz_db.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Add inspection summary to run page
        if: success()
        run: cat artifacts/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source database and analysis outputs
        uses: actions/upload-artifact@v4
        with:
          name: grundwortschatz-db-inspection
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
