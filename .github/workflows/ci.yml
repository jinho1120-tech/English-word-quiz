name: CI

on:
  push:
    branches:
      - main
      - feature/public-user-platform
  pull_request:
    branches:
      - main
      - feature/public-user-platform

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test access-code hash migration safety
        run: pnpm test:access-code-migration
      - name: Test migration against real PostgreSQL
        run: pnpm test:access-code-migration:postgres
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:5432/migration_test
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Check design system conventions
        run: pnpm check:design-system
      - name: Check Drizzle migration history
        run: pnpm exec drizzle-kit check
      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
          BETTER_AUTH_SECRET: ci-only-secret-that-is-long-enough-for-better-auth
          BETTER_AUTH_URL: http://localhost:3000
          GEMINI_API_KEY: ci-placeholder
          AZURE_SPEECH_KEY: ci-placeholder
          AZURE_SPEECH_REGION: koreacentral
